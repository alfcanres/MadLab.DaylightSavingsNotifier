<!-- Example 1: Standalone no-results card (use inside list area) -->
<div class="no-results-card d-flex gap-3 align-items-start" role="status" aria-live="polite" aria-atomic="true">
    <div class="no-results-icon" aria-hidden="true">
        <!-- simple magnifier/empty SVG -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="bi">
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.2" />
            <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            <path d="M8 8L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
        </svg>
    </div>

    <div class="flex-grow-1">
        <div class="no-results-title">{{this.title}}</div>
        <div class="no-results-hint">{{this.message}}</div>
    </div>
</div>
